<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>responsive harness</title>
<style>
  body { margin:0; background:#2a2a2a; font:12px/1.4 monospace; color:#ddd; }
  .row { display:flex; flex-wrap:wrap; gap:16px; padding:16px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { padding:4px 0; color:#9ad; }
  iframe { border:1px solid #555; display:block; background:#fff; }
</style>
</head>
<body>
<div class="row">
  <figure>
    <figcaption>375 x 812 — iPhone SE / small Android</figcaption>
    <iframe src="../2026/index.html" width="375" height="812"></iframe>
  </figure>
  <figure>
    <figcaption>390 x 844 — iPhone 14</figcaption>
    <iframe src="../2026/index.html" width="390" height="844"></iframe>
  </figure>
  <figure>
    <figcaption>768 x 1024 — iPad portrait (breakpoint edge)</figcaption>
    <iframe src="../2026/index.html" width="768" height="1024"></iframe>
  </figure>
  <figure>
    <figcaption>320 x 568 — smallest realistic phone</figcaption>
    <iframe src="../2026/index.html" width="320" height="568"></iframe>
  </figure>
</div>
</body>
</html>
